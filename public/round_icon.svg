<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <linearGradient id="aquaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#34d399" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular Icon Base -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="252" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.25" />

  <!-- Central Emblem Container -->
  <g filter="url(#softShadow)" transform="translate(15, 15) scale(0.94)">
    <circle cx="330" cy="175" r="48" fill="url(#sunGrad)" opacity="0.95" />
    <path d="M 330 105 A 70 70 0 0 1 400 175" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 16" opacity="0.6" />

    <path d="M 270 200 C 330 190 390 240 390 310 C 390 370 340 410 275 410 C 265 410 255 408 245 405 C 310 380 345 320 320 255 C 305 220 280 205 270 200 Z"
          fill="url(#aquaGrad)" opacity="0.95" />

    <path d="M 256 420 C 256 420 130 380 130 250 C 130 160 215 110 256 100 C 256 100 295 180 270 270 C 250 340 256 420 256 420 Z"
          fill="url(#leafGrad)" filter="url(#glow)" />

    <path d="M 256 125 C 240 210 220 310 256 415"
          fill="none" stroke="#064e3b" stroke-width="7" stroke-linecap="round" opacity="0.75" />
    <path d="M 235 240 C 195 230 170 245 170 245"
          fill="none" stroke="#064e3b" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <path d="M 245 300 C 205 300 185 320 185 320"
          fill="none" stroke="#064e3b" stroke-width="5" stroke-linecap="round" opacity="0.6" />

    <path d="M 256 370 C 285 350 315 355 330 375 C 315 390 280 395 256 370 Z"
          fill="#a7f3d0" opacity="0.85" />

    <path d="M 175 145 Q 185 145 185 135 Q 185 145 195 145 Q 185 145 185 155 Q 185 145 175 145 Z"
          fill="#ffffff" opacity="0.9" />
  </g>
</svg>
